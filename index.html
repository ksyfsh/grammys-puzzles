<!doctype html>
<!--
  GRAMMY'S PUZZLES — the one and only web page.

  Everything the app shows lives in this file as four "screens".
  Only one screen is visible at a time; js/app.js switches between them.
    1. screen-home     the first thing she sees (two big buttons)
    2. screen-choose   the grid of pictures to choose from
    3. screen-start    one picture, with "how many pieces?" or "Keep Going"
    4. screen-puzzle   the puzzle itself (toolbar, table, and piece tray)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Stops the iPad from zooming in and out, and lets us use the whole screen. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Grammy's Puzzles</title>

  <!-- These lines make it behave like a real app once added to the Home Screen. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Grammy's Puzzles">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F7F3EA">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== 1. HOME ===================== -->
  <section id="screen-home" class="screen">
    <div class="home-inner">
      <h1 class="app-title">Grammy's Puzzles</h1>
      <div class="home-buttons">
        <button id="btn-choose" class="btn btn-primary btn-huge" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v3a2 2 0 1 0 4 0V4h6v6h-3a2 2 0 1 0 0 4h3v6h-6v-3a2 2 0 1 0-4 0v3H4z"/></svg>
          <span>Choose a Puzzle</span>
        </button>
        <button id="btn-add-photo" class="btn btn-secondary btn-huge" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          <span>Add a Photo</span>
        </button>
      </div>
      <p id="home-message" class="message" hidden></p>
    </div>
  </section>

  <!-- ===================== 2. CHOOSE A PICTURE ===================== -->
  <section id="screen-choose" class="screen" hidden>
    <header class="bar">
      <button class="btn btn-secondary btn-bar" type="button" data-go="home">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>
      <h2>Choose a Puzzle</h2>
    </header>
    <div class="scroll-area" id="choose-scroll">
      <p id="choose-message" class="message" hidden></p>
      <h3 class="section-title">Pictures</h3>
      <div id="builtin-grid" class="card-grid"></div>
      <h3 class="section-title">Your Photos</h3>
      <div id="photo-grid" class="card-grid"></div>
      <p id="no-photos" class="hint">Photos you add with the “Add a Photo” button on the home screen will show up here.</p>
    </div>
  </section>

  <!-- ===================== 3. START A PUZZLE ===================== -->
  <section id="screen-start" class="screen" hidden>
    <header class="bar">
      <button class="btn btn-secondary btn-bar" type="button" data-go="choose">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span>Back</span>
      </button>
      <h2 id="start-title">Puzzle</h2>
    </header>
    <div class="start-layout">
      <div class="start-preview-wrap"><img id="start-preview" alt=""></div>
      <div id="start-panel" class="start-panel"></div>
    </div>
  </section>

  <!-- ===================== 4. THE PUZZLE ===================== -->
  <section id="screen-puzzle" class="screen" hidden>
    <nav class="toolbar">
      <button id="tool-home" class="btn btn-secondary btn-tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </button>
      <button id="tool-peek" class="btn btn-secondary btn-tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="label">Peek at Picture</span>
      </button>
      <button id="tool-edges" class="btn btn-secondary btn-tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><rect x="8" y="8" width="8" height="8" stroke-dasharray="2 2"/></svg>
        <span class="label">Edge Pieces Only</span>
      </button>
      <button id="tool-tidy" class="btn btn-secondary btn-tool" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Tidy Up Pieces</span>
      </button>
      <button id="tool-sound" class="btn btn-secondary btn-tool" type="button">
        <svg class="icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>
        <svg class="icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6"/><path d="M22 9l-5 6"/></svg>
        <span class="label">Sound On</span>
      </button>
    </nav>

    <div id="play" class="play">
      <!-- The "table": the board sits in the middle; loose pieces can go anywhere on it. -->
      <div id="table" class="table">
        <div id="board" class="board"></div>
        <div id="pieces-layer" class="pieces-layer"></div>
      </div>
      <!-- The "tray": a scrolling box of pieces that haven't been used yet. -->
      <div id="tray" class="tray">
        <div id="tray-inner" class="tray-inner"></div>
        <p id="tray-message" class="tray-message" hidden></p>
      </div>
    </div>

    <!-- The picture window from "Peek at Picture". Drag it to move it; pinch or use the buttons to resize. -->
    <div id="peek-window" class="peek-window" hidden>
      <canvas id="peek" class="peek-picture"></canvas>
      <div class="peek-bar">
        <button id="peek-smaller" class="btn btn-secondary btn-peek" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          <span>Smaller</span>
        </button>
        <button id="peek-bigger" class="btn btn-secondary btn-peek" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>Bigger</span>
        </button>
        <button id="peek-hide" class="btn btn-primary btn-peek" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
          <span>Hide</span>
        </button>
      </div>
    </div>

    <!-- A piece being dragged floats in this layer, above everything else. -->
    <div id="drag-layer" class="drag-layer"></div>

    <!-- Shown once, when the puzzle is finished. -->
    <div id="done-panel" class="done-panel" hidden>
      <div class="done-card">
        <p class="done-title">You did it!</p>
        <p class="done-sub">What a lovely picture.</p>
        <button id="done-another" class="btn btn-primary btn-big" type="button">Choose Another Puzzle</button>
        <button id="done-admire" class="btn btn-secondary btn-big" type="button">Look at My Picture</button>
      </div>
    </div>
  </section>

  <!-- Hidden file chooser. Tapping "Add a Photo" opens it, which shows the iPad's Photos picker. -->
  <input id="photo-input" type="file" accept="image/*" multiple hidden>

  <!-- The app's code, loaded in order. -->
  <script src="js/storage.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/puzzle.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
